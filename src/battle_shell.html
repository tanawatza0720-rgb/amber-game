<title>ตำนานป่าอัมพร · ด่านเนื้อเรื่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Bai+Jamjuree:wght@400;600&display=swap">
<style>
:root{--panel:rgba(24,18,14,.84);--line:rgba(255,214,150,.24);--bone:#fbf1dc;--muted:#cdbb9b;--amber:#ffb347;--amberD:#d9822b;--mint:#5fe0c0;--red:#ff5a4e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#2a1a14;color:var(--bone);font-family:'Bai Jamjuree',system-ui,-apple-system,sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.disp,#stTitle,#wave,.oc,.sk b,#banner,#skname,.node .nid,#rTitle,.ubar .lv{font-family:'Chakra Petch','Bai Jamjuree',sans-serif}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#stageMsg{display:none!important}
/* แถบพลังชีวิต */
.ubar{position:absolute;left:0;top:0;width:96px;padding:3px 4px 4px;border-radius:7px;background:rgba(10,8,6,.62);border:1px solid rgba(255,255,255,.12);will-change:transform}
.ubar.boss{width:132px;border-color:rgba(255,90,78,.6)}
.un{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden}
.un .lv{font-weight:700;font-size:10px;color:var(--amber);flex:none}
.un .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.un .st{flex:none;font-size:9px;background:#8a5cff;color:#fff;border-radius:3px;padding:0 3px}
.hp{position:relative;height:9px;margin-top:2px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .35s ease}
.p .hp i{background:linear-gradient(90deg,#3fcf7f,#8ff0a4)}
.e .hp i{background:linear-gradient(90deg,#d8392c,#ff7b5a)}
.hp em{position:absolute;inset:0;font-style:normal;font-size:8px;line-height:9px;text-align:center;color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.atb{height:3px;margin-top:2px;border-radius:2px;background:rgba(0,0,0,.5);overflow:hidden}
.atb i{display:block;height:100%;width:0;background:#6fd3ff}
/* ตัวเลขดาเมจ */
.num{position:absolute;transform:translate(-50%,-50%);font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);animation:rise 1.1s ease-out forwards;white-space:nowrap}
.num.crit{font-size:30px;color:#ffd24a}
.num.crit::before{content:'คริ! ';font-size:15px}
.num.info{font-size:15px;color:#c9b8ff}
.num.heal{color:#8ff0a4}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-170%)}}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
#stTitle{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wave{font-size:12px;color:var(--amber);margin-top:1px}
.hbtns{display:flex;gap:6px;pointer-events:auto;flex:none}
.hb{min-width:48px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px}
.hb.on{background:linear-gradient(180deg,#ffcf7a,#d9822b);color:#2b1808;border-color:#ffd9a0}
#order{display:flex;gap:4px;margin-top:8px;align-items:center}
#order::before{content:'ลำดับ';font-size:10px;color:var(--muted);margin-right:2px}
.oc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid;background:rgba(10,8,6,.7);flex:none}
.oc.p{border-color:#5fe0a0;color:#c9ffe3}
.oc.e{border-color:#ff6b5a;color:#ffd0c8}
.oc.boss{border-color:#ffd24a;box-shadow:0 0 8px #ff5a4e}
.oc.now{width:44px;height:44px;font-size:12px;box-shadow:0 0 0 3px rgba(255,179,71,.6)}
/* ท่า */
#skwrap{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#skdesc{font-size:12px;color:var(--muted);text-align:center;text-shadow:0 1px 2px #000;min-height:16px;max-width:520px}
#skills{display:flex;gap:8px;pointer-events:auto;width:100%;max-width:520px}
.sk{position:relative;flex:1;min-height:62px;border-radius:14px;border:1px solid rgba(255,214,150,.4);background:linear-gradient(180deg,rgba(70,52,36,.95),rgba(34,25,18,.95));padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;animation:pop .25s ease}
.sk b{font-size:14px;line-height:1.15}
.sk small{font-size:10px;color:var(--muted)}
.sk.sp{border-color:#ffcf7a;background:linear-gradient(180deg,rgba(120,70,24,.95),rgba(52,30,14,.95))}
.sk:active:not(:disabled){transform:scale(.96)}
.sk:disabled{filter:grayscale(.8) brightness(.7)}
.sk .cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-style:normal;font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:#fff}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
#skname{position:fixed;top:30%;left:50%;transform:translateX(-50%);padding:6px 22px;border-radius:8px;font-weight:700;font-size:18px;white-space:nowrap;pointer-events:none;animation:pop .2s ease}
#skname.p{background:linear-gradient(90deg,transparent,rgba(217,130,43,.9),transparent);color:#fff6e0}
#skname.e{background:linear-gradient(90deg,transparent,rgba(180,30,30,.9),transparent);color:#ffe3dd}
#banner{position:fixed;top:40%;left:0;right:0;text-align:center;font-weight:700;font-size:34px;letter-spacing:.04em;color:#fff;text-shadow:0 3px 0 #6a3a10,0 0 18px rgba(255,160,60,.8);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55),transparent);padding:10px 0;opacity:0}
#banner.show{animation:ban 1.3s ease forwards}
#banner.boss{color:#ffd0c8;text-shadow:0 3px 0 #5a0c0c,0 0 20px rgba(255,60,40,.9)}
@keyframes ban{0%{opacity:0;transform:scaleX(.3)}15%{opacity:1;transform:scaleX(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
/* แผนที่ */
#map,#result{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(20,12,8,.35),rgba(10,6,4,.8))}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card h1{margin:0;font-family:'Chakra Petch',sans-serif;font-size:22px;color:var(--amber)}
.card .sub{margin:4px 0 14px;font-size:12px;color:var(--muted)}
#nodes{display:flex;flex-direction:column;gap:10px}
.node{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(70,52,36,.9),rgba(38,28,20,.9))}
.node:not(:disabled):active{transform:scale(.98)}
.node .nid{grid-row:1/3;font-weight:700;font-size:20px;color:var(--amber);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.node .nnm{font-weight:600;font-size:15px}
.node .nst{grid-row:1/3;grid-column:3;color:#ffd24a;font-size:16px;letter-spacing:2px}
.node .nmeta{font-size:11px;color:var(--muted)}
.node.bossn{border-color:rgba(255,90,78,.6)}
.node.bossn .nid{background:rgba(140,20,20,.6);color:#ffd0c8}
.node.locked{opacity:.45}
.node.locked .nst{font-size:12px;color:var(--muted);letter-spacing:0}
.team{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
.team b{color:var(--bone)}
.mbtn{margin-top:12px;width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px}
.mbtn.on{border-color:#8fe8ff;color:#bff3ff;background:rgba(80,200,255,.12)}
a.mbtn{display:grid;place-items:center;text-decoration:none;color:inherit}
.sub.net{margin-top:-8px;color:var(--mint)}.sub.net.off{color:#ffc27a}
.rbtns button:disabled{opacity:.5}
#bMsg{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;max-width:90vw;background:rgba(120,30,20,.92);border:1px solid rgba(255,160,140,.5);border-radius:12px;padding:10px 16px;font-size:13px;text-align:center}
#loadMsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px}
/* เมนูคำสั่งแบบแนวตั้งด้านขวา (จอแนวนอน) */
#acthd{pointer-events:none;display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 3px #000}
#acthd b{font-family:'Chakra Petch',sans-serif;font-size:16px}
#acthd span{font-size:11px;color:var(--muted)}
@media (min-aspect-ratio:9/10){
  #skwrap{left:auto;right:14px;bottom:auto;top:50%;transform:translateY(-35%);width:250px;align-items:stretch;padding:0;gap:6px}
  #acthd{align-items:flex-start;padding:8px 14px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,rgba(217,130,43,.85),rgba(217,130,43,.1));border-left:3px solid #ffcf7a}
  #skills{flex-direction:column;gap:4px;max-width:none}
  .sk{min-height:0;flex:none;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;padding:11px 14px;border-radius:6px;background:linear-gradient(90deg,rgba(20,15,11,.92),rgba(20,15,11,.55));border:1px solid rgba(255,214,150,.18);border-left:3px solid rgba(255,214,150,.35);animation:slidein .25s ease both}
  .sk:nth-child(2){animation-delay:.04s}.sk:nth-child(3){animation-delay:.08s}
  .sk.sp{background:linear-gradient(90deg,rgba(70,40,14,.92),rgba(40,24,10,.55));border-left-color:#ffcf7a}
  .sk:hover:not(:disabled),.sk:focus-visible{border-left-color:#fff;background:linear-gradient(90deg,rgba(217,130,43,.75),rgba(40,24,10,.5));outline:none}
  .sk .cd{inset:0 0 0 auto;width:44px;font-size:18px}
  #skdesc{text-align:left;font-size:11px;min-height:0}
}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
/* ผลลัพธ์ */
#result .card{text-align:center;animation:pop .3s ease}
#rTitle{font-size:34px;font-weight:700;margin:0}
#result.win #rTitle{color:#ffd24a;text-shadow:0 0 16px rgba(255,180,60,.6)}
#result.lose #rTitle{color:#ff8a7a}
#rStars{font-size:40px;letter-spacing:6px;margin:6px 0 2px;color:rgba(255,255,255,.15)}
#rStars .on{display:inline-block;color:#ffd24a;text-shadow:0 0 12px rgba(255,200,60,.8);animation:star .5s ease both}
@keyframes star{0%{transform:scale(0) rotate(-90deg);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#rStarsNote{font-size:12px;color:var(--muted);min-height:16px}
#rRew{margin:14px 0;display:flex;flex-direction:column;gap:6px}
.rr{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.3);font-size:13px;text-align:left}
.rr b{color:var(--amber);flex:none}
.rbtns{display:flex;gap:8px}
.rbtns button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-family:'Chakra Petch',sans-serif;font-weight:700}
.rbtns .main{background:linear-gradient(180deg,#ffcf7a,#d9822b);color:#2b1808;border-color:#ffd9a0}
@media (max-width:380px){.ubar{width:84px}.ubar.boss{width:112px}.sk b{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
<div id="view"></div>
<div id="ov"></div>
<div id="stageMsg" hidden></div>
<div id="hud" hidden>
  <div class="hrow">
    <div class="title"><div id="stTitle"></div><div id="wave"></div></div>
    <div class="hbtns">
      <button class="hb" id="bAuto" aria-pressed="false">ออโต้</button>
      <button class="hb" id="bSpeed">x1</button>
      <button class="hb" id="bExit" aria-label="ออกจากด่าน">✕</button>
    </div>
  </div>
  <div id="order"></div>
</div>
<div id="skname" hidden></div>
<div id="banner" hidden></div>
<div id="skwrap"><div id="acthd" hidden></div><div id="skills" hidden></div><div id="skdesc"></div></div>
<div id="bMsg" hidden></div>
<div id="loadMsg" hidden>กำลังโหลดโมเดล…</div>
<div id="map" class="modal" hidden>
  <div class="card">
    <h1>บทที่ 1 · ป่าไผ่สนธยา</h1>
    <p class="sub">ผ่านด่านก่อนหน้าเพื่อปลดล็อกด่านถัดไป · ด่านละ 6 พลังงาน</p>
    <p class="sub net" id="mapNet"></p>
    <div id="nodes"></div>
    <button id="bModel" class="mbtn"></button>
    <div class="team">ทีมของคุณ: <span id="teamLine"></span><br><small>เปลี่ยนทีมได้ที่ปุ่ม “จัดทีม” ในฟาร์ม</small></div>
    <a class="mbtn back" href="index.html">‹ กลับฟาร์ม</a>
  </div>
</div>
<div id="result" hidden>
  <div class="card">
    <h2 id="rTitle"></h2>
    <div id="rStars"></div>
    <div id="rStarsNote"></div>
    <div id="rRew"></div>
    <div class="rbtns">
      <button id="rMap">แผนที่</button>
      <button id="rRetry">เล่นอีกครั้ง</button>
      <button id="rNext" class="main">ด่านถัดไป</button>
    </div>
  </div>
</div>

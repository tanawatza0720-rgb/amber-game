<title>ตำนานป่าอัมพร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Bai+Jamjuree:wght@400;600&display=swap">
<style>
:root{--ink:#1c1510;--panel:rgba(28,22,16,.82);--panel2:#2a2119;--line:rgba(255,214,150,.22);--bone:#fbf1dc;--muted:#cdbb9b;--amber:#ffb347;--amberD:#d9822b;--mint:#5fe0c0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#9cc6ee;color:var(--bone);font-family:'Bai Jamjuree',system-ui,-apple-system,sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.disp{font-family:'Chakra Petch','Bai Jamjuree',sans-serif}
/* แถบบน */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.profile{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px 6px 6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ava{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#ffcf7a,#d9822b);display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:20px;color:#3a2210}
#pname{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;line-height:1.1}
.lvrow{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px}
.lvrow b{font-family:'Chakra Petch',sans-serif;color:var(--amber)}
.xp{width:84px;height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#8ff0c4,#5fe0c0)}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;min-width:110px;justify-content:space-between;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill svg{width:24px;height:24px;flex:none}
.pill small{font-family:'Bai Jamjuree',sans-serif;font-weight:400;font-size:10px;color:var(--muted);margin-left:4px}
.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.12)}}
/* แถบซ้าย */
#rail{position:fixed;left:12px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.rbtn{position:relative;width:58px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rbtn svg{width:28px;height:28px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#e8453c;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff3}
/* เมนูล่าง */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100% - 24px)}
.nbtn{position:relative;border:0;background:linear-gradient(180deg,#3a2d20,#241b13);border-radius:12px;width:66px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,220,160,.18)}
.nbtn svg{width:28px;height:28px}
.nbtn.big{width:78px;padding:12px 2px 8px;background:linear-gradient(180deg,#ffc56a,#d9822b);color:#2a1606;margin-top:-18px;box-shadow:0 4px 14px rgba(217,130,43,.5),inset 0 1px 0 #fff6}
.nbtn:active,.rbtn:active{transform:scale(.95)}
.nbtn:focus-visible,.rbtn:focus-visible,.sbtn:focus-visible,.sitem:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
/* แผ่นข้อมูล */
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));max-height:min(62vh,520px);overflow:auto;background:rgba(30,23,17,.94);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
.shHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
#shTitle{margin:0;font-family:'Chakra Petch',sans-serif;font-size:22px;color:var(--amber)}
#shSub{margin:2px 0 0;font-size:12px;color:var(--muted)}
#shClose{border:0;background:rgba(255,255,255,.08);width:32px;height:32px;border-radius:10px;font-size:18px;line-height:1}
.ptxt{margin:0 0 10px;color:#eadcc0;line-height:1.6}
.rows{display:grid;gap:4px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border-radius:8px;padding:7px 10px;font-size:13px}
.row b{font-family:'Chakra Petch',sans-serif;font-variant-numeric:tabular-nums}
#shActs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.sbtn{border:0;border-radius:12px;padding:11px 10px;font-weight:700;background:linear-gradient(180deg,#ffc56a,#d9822b);color:#2a1606}
.sbtn.gold{background:linear-gradient(180deg,#ffe28a,#e0a83a)}
.sbtn.ghost{background:rgba(255,255,255,.08);color:var(--bone);border:1px solid var(--line)}
.sbtn.small{padding:7px 10px;font-size:12px;min-width:84px}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-bottom:6px}
.mcard{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.mcard b{font-family:'Chakra Petch',sans-serif}.mcard span{font-size:12px;color:var(--amber)}
.shop{display:grid;gap:6px}
.sitem{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;text-align:left}
.sitem b{font-family:'Chakra Petch',sans-serif;color:var(--amber)}
.quests{display:grid;gap:8px}
.quest{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px}
.quest>div{flex:1;display:grid;gap:3px}.quest span{font-size:12px;color:var(--muted)}
.qbar{height:6px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}.qbar i{display:block;height:100%;background:var(--mint)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:10px;padding:8px 6px;text-align:center;display:grid;gap:2px}
.day span{font-size:11px;color:var(--muted)}.day b{font-size:12px}
.day.got{opacity:.45}.day.now{border-color:var(--amber);background:rgba(255,179,71,.14)}
.mail{display:grid;gap:6px}.mitem{background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.mitem span{font-size:12px;color:var(--muted)}
/* ป้ายมอนสเตอร์ */
#mtag{position:fixed;transform:translate(-50%,-100%);background:rgba(28,22,16,.9);border:1px solid var(--line);border-radius:10px;padding:5px 10px;text-align:center;pointer-events:none;white-space:nowrap}
#mtName{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px}
#mtInfo{font-size:11px;color:var(--amber)}
#toast{z-index:9;position:fixed;top:calc(118px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(28,22,16,.92);border:1px solid var(--amber);border-radius:10px;padding:8px 14px;font-size:13px;text-align:center;z-index:5}
#hint{position:fixed;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:11px;color:#1d2a3a;background:rgba(255,255,255,.55);border-radius:8px;padding:4px 8px;pointer-events:none}
#stageMsg{display:none}
[hidden]{display:none!important}
@media (max-width:520px){
  .nbtn{width:56px;font-size:11px}.nbtn.big{width:66px}.pill{min-width:92px;font-size:13px}.xp{width:60px}#hint{display:none}
  #rail{top:calc(70px + env(safe-area-inset-top,0px))}.rbtn{width:52px}
}

/* สถานะเชื่อมต่อ + บัญชี */
.profile{cursor:pointer}
#ava{position:relative}
#netDot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid #241b13;background:#ffb347}
#netDot.online{background:#5fe0c0}
.nameRow{display:flex;gap:8px;margin-top:8px}
.nameRow input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--bone);font:inherit;padding:0 12px;user-select:text;-webkit-user-select:text}
/* ===== หน้าเข้าสู่ระบบ ===== */
body.preLogin #top,body.preLogin #rail,body.preLogin #dock,body.preLogin #hint,body.preLogin #mtag,body.preLogin #sheet,body.preLogin #loadMsg{display:none!important}
#login{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(20,12,6,.35),rgba(12,8,5,.82) 70%);transition:opacity .45s}
#login.bye{opacity:0;pointer-events:none}
.lgCard{width:min(380px,100%);background:linear-gradient(180deg,rgba(52,38,26,.94),rgba(30,22,15,.96));border:1px solid rgba(255,200,120,.35);border-radius:22px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,230,180,.18);animation:lgIn .5s ease}
@keyframes lgIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.lgLogo{width:74px;height:74px;margin:-62px auto 8px;border-radius:22px;background:linear-gradient(145deg,#ffd27a,#d9822b);display:grid;place-items:center;box-shadow:0 10px 30px rgba(217,130,43,.55),inset 0 2px 0 rgba(255,255,255,.5)}
.lgLogo svg{width:46px;height:46px}
#login h1{margin:4px 0 2px;font-family:'Chakra Petch',sans-serif;font-size:30px;letter-spacing:.5px;background:linear-gradient(180deg,#fff3d6,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.lgTag{margin:0 0 18px;font-size:13px;color:var(--muted)}
#lgBody{display:grid;gap:10px}
.lgBtn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;color:var(--bone);padding:0 16px}
.lgBtn.main{background:linear-gradient(180deg,#ffcf7a,#d9822b);color:#2b1808;border-color:#ffd9a0;box-shadow:0 6px 18px rgba(217,130,43,.4)}
.lgBtn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.lgBtn.ghost{background:rgba(255,255,255,.07)}
.lgBtn.link{min-height:36px;background:none;border:0;font-family:'Bai Jamjuree',sans-serif;font-weight:400;font-size:13px;color:var(--muted);text-decoration:underline}
.lgBtn:disabled{opacity:.5}
.lgBtn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.lgOr{margin:2px 0;font-size:12px;color:var(--muted)}
.lgSmall{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.lgMsg{margin:0 0 4px;font-size:14px;color:#eadcc0;line-height:1.6}
.lgWait{padding:18px 0;color:var(--muted);font-size:14px}
.lgWait::before{content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border-radius:50%;border:2px solid var(--amber);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lgUser{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lgAv{flex:none;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ffcf7a,#d9822b);color:#3a2210;display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px}
.lgUser b{display:block;font-size:14px}.lgUser span{font-size:12px;color:var(--muted);word-break:break-all}
#lgNote{margin:12px 0 0;font-size:12.5px;color:var(--muted);min-height:0}
#lgNote:empty{display:none}
#lgNote.warn{color:#ffcf8a}
.lgFoot{margin-top:16px;font-size:12px}
.lgFoot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lgCard{animation:none}.lgWait::before{animation:none}}
/* ===== คลังมอนสเตอร์ (หน้าต่างไอคอน) ===== */
body.boxOpen #top,body.boxOpen #rail,body.boxOpen #dock,body.boxOpen #hint,body.boxOpen #mtag,body.boxOpen #sheet{display:none!important}
#box{position:fixed;inset:0;z-index:5;background:rgba(10,7,5,.55);display:flex;align-items:center;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#box[hidden]{display:none}
#box.v3d{background:none;pointer-events:none}
#box.v3d .bWin{display:none}
.bWin{width:min(1060px,100%);height:min(640px,100%);display:flex;flex-direction:column;background:linear-gradient(180deg,#3b2c1f,#2a1f16);border:2px solid #7a5a34;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,160,.2);overflow:hidden;animation:up .2s ease}
.bBar{flex:none;height:44px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(180deg,#5a4128,#3d2c1c);border-bottom:2px solid #7a5a34}
.bBar h2{margin:0;font-family:'Chakra Petch',sans-serif;font-size:19px;letter-spacing:.5px;text-shadow:0 2px 3px #000}
.bBar h2 b{color:var(--amber)}
#bClose{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:8px;border:0;background:none;font-size:30px;line-height:1;color:var(--bone)}
.bBody{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
.bLeft{flex:1;min-width:0;overflow:auto;overscroll-behavior:contain;padding:2px}
#bList{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.ic{position:relative;aspect-ratio:1;border-radius:9px;padding:0;border:2px solid #8a93a6;background:#221a14;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.ic.r1{border-color:#8a93a6}.ic.r2{border-color:#4f9dff}.ic.r3{border-color:#ffc94d;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 6px rgba(255,201,77,.45)}.ic.r4{border-color:#ff6ab0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 10px rgba(255,106,176,.7),0 0 18px rgba(176,108,255,.45);animation:divine 2.4s ease-in-out infinite}
@keyframes divine{0%,100%{border-color:#ff6ab0}50%{border-color:#b06cff}}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ic .st{position:absolute;top:1px;left:0;right:0;text-align:center;color:#ffd24a;font-size:10px;letter-spacing:-1px;line-height:1;text-shadow:0 0 2px #000,0 1px 1px #000}
.ic .st{font-family:inherit;font-weight:700;letter-spacing:0;font-size:9.5px;top:2px}.ic.r1 .st{color:#dfe5f0}.ic.r2 .st{color:#8cc8ff}.ic.r3 .st{color:#ffe07a}.ic.r4 .st{color:#ffb0dc}
.iTier,.tierTag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;color:#1a120a;vertical-align:middle}
.iTier{margin-left:6px}.iTier.r1,.tierTag.r1{background:#c9d1dc}.iTier.r2,.tierTag.r2{background:#5fb3ff}.iTier.r3,.tierTag.r3{background:linear-gradient(90deg,#ffe07a,#ffb030);box-shadow:0 0 6px rgba(255,190,60,.5)}.iTier.r4,.tierTag.r4{background:linear-gradient(90deg,#ff8ac4,#b06cff);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:0 0 10px rgba(255,106,176,.7)}
.oddsT{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:13px}.oddsT th{font-weight:600;opacity:.7;text-align:right;padding:3px 4px}.oddsT th:first-child,.oddsT td:first-child{text-align:left}.oddsT td{text-align:right;padding:4px;border-top:1px solid rgba(255,255,255,.08)}
.ic .lv{position:absolute;right:3px;bottom:1px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;line-height:1.1;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.ic .lv.max{color:var(--amber)}
.ic .tm{position:absolute;left:3px;bottom:3px;width:16px;height:16px;border-radius:4px;background:var(--amber);display:grid;place-items:center}
.ic .tm svg{width:11px;height:11px}
.ic .ev{position:absolute;left:3px;top:13px;width:14px;height:14px;border-radius:50%;background:#5fe0c0;color:#0e2a22;font-size:11px;font-weight:700;display:grid;place-items:center;animation:pulse 1.2s infinite}
.ic.sel{outline:3px solid #fff3c4;outline-offset:1px;box-shadow:0 0 12px rgba(255,210,120,.8)}
.ic.empty{border-color:rgba(255,214,150,.12);background:rgba(0,0,0,.28);display:grid;place-items:center;cursor:default}
.ic.empty svg{width:46%;opacity:.13}
@keyframes pulse{50%{opacity:.55}}
.ic.pop{animation:pop .5s ease}
@keyframes pop{30%{transform:scale(1.15);filter:brightness(1.8)}}
.bRight{flex:none;width:370px;display:flex;flex-direction:column;gap:8px;min-height:0}
.bInfo{flex:1;min-height:0;display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bTabs{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 6px}
.bTabs button{width:62px;height:40px;border-radius:8px 0 0 8px;border:1px solid var(--line);border-right:0;background:rgba(255,255,255,.04);font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;color:var(--muted)}
.bTabs button.on{background:linear-gradient(180deg,#ffcf7a,#d9822b);color:#2b1808}
.bPage{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:rgba(20,14,10,.55)}
.bPageIn{flex:1;overflow:auto;padding:10px 12px;overscroll-behavior:contain}
.iHead{display:flex;align-items:center;gap:8px}
.iEl{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#1a1210}
.iHead b{font-family:'Chakra Petch',sans-serif;font-size:18px}
.iHead .st{color:#ffd24a;font-size:13px;letter-spacing:-1px}
.iSub{font-size:12px;color:var(--muted);margin:2px 0 8px}
.iExp{display:flex;align-items:center;gap:8px;font-size:12px}
.iExp span{font-family:'Chakra Petch',sans-serif;font-weight:700;color:var(--muted);width:30px}
.iExp div{flex:1;height:14px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.1)}
.iExp i{display:block;height:100%;background:linear-gradient(90deg,#3aa88a,#8ff0c4);transition:width .3s}
.iExp em{position:absolute;inset:0;text-align:center;font-style:normal;font-size:10px;font-weight:700;line-height:13px;color:#fff;text-shadow:0 1px 2px #000}
.iTbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.iTbl td{padding:4px 2px}.iTbl td:last-child{text-align:right;font-family:'Chakra Petch',sans-serif;font-weight:700}
.iTbl tr.sep td{border-top:1px solid var(--line);padding-top:7px}
.iTbl .pw{color:var(--amber)}
.skr{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:6px}

let RIGS=[];
function channel(o,p){o.__ch=o.__ch||{};if(!o.__ch[p]){const c={o,p,x:o[p],v:0,t:o[p],k:200,z:.8};o.__ch[p]=c;RIGS.push(c);}return o.__ch[p];}
function rigSet(o,p,v){const c=channel(o,p);c.x=c.t=v;c.v=0;o[p]=v;}
function applyPose(list){list.forEach(([o,p,v])=>rigSet(o,p,v));}
function poseTo(list,d,z){const k=Math.pow(5.2/Math.max(d,.06),2);list.forEach(([o,p,v])=>{const c=channel(o,p);c.t=v;c.k=k;c.z=z==null?.78:z;});return sleep(d*1000);}
function rigUpdate(dt){
  const n=Math.max(1,Math.ceil(dt*180)), h=dt/n;
  for(const c of RIGS){for(let i=0;i<n;i++){const a=c.k*(c.t-c.x)-2*c.z*Math.sqrt(c.k)*c.v;c.v+=a*h;c.x+=c.v*h;}c.o[c.p]=c.x;}
}

let TRAILS=[];
function makeTrail(sword,color){
  const N=16, pos=new Float32Array(N*2*3), col=new Float32Array(N*2*3), idx=[];
  for(let i=0;i<N-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.frustumCulled=false; scene.add(m);
  const tr={m,g,N,pts:[],c:new THREE.Color(color),amp:0,base:sword.userData.base,tip:sword.userData.tip,prev:null};
  TRAILS.push(tr); return tr;
}
function trailUpdate(){
  const a=new THREE.Vector3(), b=new THREE.Vector3();
  for(const tr of TRAILS){
    if(!tr.tip.parent||!tr.m.parent)continue;
    tr.base.getWorldPosition(a); tr.tip.getWorldPosition(b);
    const sp=tr.prev?b.distanceTo(tr.prev):0; tr.prev=b.clone();
    tr.amp+=(Math.min(1,Math.max(0,(sp-.03)*10))-tr.amp)*.3; if(!tr.base.parent.visible)tr.amp=0;
    tr.pts.unshift([a.clone(),b.clone()]); if(tr.pts.length>tr.N)tr.pts.pop();
    const P=tr.g.attributes.position.array, C=tr.g.attributes.color.array;
    for(let i=0;i<tr.N;i++){const q=tr.pts[Math.min(i,tr.pts.length-1)];const f=.55*tr.amp*Math.pow(1-i/(tr.N-1),2.2);
      P.set([q[0].x,q[0].y,q[0].z,q[1].x,q[1].y,q[1].z],i*6);
      C.set([tr.c.r*f*.15,tr.c.g*f*.15,tr.c.b*f*.15,tr.c.r*f,tr.c.g*f,tr.c.b*f],i*6);}
    tr.g.attributes.position.needsUpdate=true; tr.g.attributes.color.needsUpdate=true;
  }
}

// เรียก API แล้วอัปเดตสถานะ ถ้าพลาดขึ้นข้อความภาษาไทย คืนค่า null
async function act(fn,args){
  if(NET.busy)return null; NET.busy=true;
  try{const r=await api(fn,args); if(r&&r.state)applyState(r.state); return r;}
  catch(e){toast(ERR[e.code]||ERR.network); return null;}
  finally{NET.busy=false;}
}
// เตรียมตัวเชื่อม + อ่านบัญชีที่ล็อกอินค้างไว้ (ไม่สร้างบัญชีใหม่) คืน user หรือ null
async function authInit(){
  if(!window.supabase||!SUPABASE_URL||!SUPABASE_KEY)throw new Error('no client');
  if(!NET.sb)NET.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:SafeStore,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await withTimeout(NET.sb.auth.getSession(),15000);
  // บัญชีที่จำไว้ใช้ไม่ได้แล้ว (เช่นบัตรต่ออายุหมด): ล้างออกแล้วให้ล็อกอินใหม่ แทนที่จะขึ้นว่าเชื่อมต่อไม่ได้
  if(error){console.warn('session',error.message);try{await NET.sb.auth.signOut({scope:'local'});}catch(e){} NET.user=null; NET.sessionLost=true; return null;}
  NET.user=(data&&data.session&&data.session.user)||null;
  return NET.user;
}
const redirectTo=()=>location.origin+location.pathname;
async function signInGoogle(){
  // ผู้เยี่ยมชมที่ล็อกอินค้างอยู่: ผูก Google เข้ากับบัญชีเดิม เซฟจะติดไปด้วย
  if(NET.user&&NET.user.is_anonymous){
    const {error}=await NET.sb.auth.linkIdentity({provider:'google',options:{redirectTo:redirectTo()}});
    if(!error)return; }
  const {error}=await NET.sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectTo(),queryParams:{prompt:'select_account'}}});
  if(error)throw error;
}
async function switchToGoogle(){ // บัญชี Google นี้มีเซฟอยู่แล้ว: ออกจากผู้เยี่ยมชมแล้วเข้าบัญชี Google
  try{await NET.sb.auth.signOut({scope:'local'});}catch(e){}
  NET.user=null; await signInGoogle();
}
async function signInGuest(){
  const r=await withTimeout(NET.sb.auth.signInAnonymously(),8000); if(r.error)throw r.error; NET.user=r.data.user; return NET.user;
}
async function signOutAll(){ try{await NET.sb.auth.signOut({scope:'local'});}catch(e){} NET.user=null; }

async function linkGoogle(){
  if(NET.mode!=='online')return toast('ต้องเชื่อมต่อเซิร์ฟเวอร์ก่อน');
  try{await signInGoogle();}catch(e){toast('ผูกบัญชีไม่สำเร็จ: '+e.message);}

let MESHY=null, USE_MESHY=true, MXA=null;
const MXA_URL='kzr/kazekiri_anims.json';
// โมเดลตัวละครจาก Meshy ที่ใช้โครงกระดูก Mixamo (ใช้ท่าชุดเดียวกันได้)
const RIG_URLS={kazekiri:'kzr/kazekiri_rig.json',kuroga:'krg/kuroga_rig.json',hakuneko:'hkn/hakuneko_rig.json',morihime:'mrh/morihime_rig.json'}, RIGDB={};
function loadRig(key,onProgress){
  if(RIGDB[key])return Promise.resolve(RIGDB[key]);
  return new Promise(res=>{
    if(!THREE.GLTFLoader||!THREE.SkeletonUtils||!RIG_URLS[key]){res(null);return;}
    new THREE.GLTFLoader().load(RIG_URLS[key],g=>{RIGDB[key]=g;res(g);},x=>{if(onProgress&&x.total)onProgress(x.loaded/x.total);},()=>res(null));
  });
}
function loadMeshy(onProgress){
  const anims=fetch(MXA_URL).then(r=>r.ok?r.json():null).then(j=>{MXA=j;}).catch(()=>{});
  return Promise.all([loadRig('kazekiri',onProgress),loadRig('kuroga'),loadRig('hakuneko'),loadRig('morihime'),anims]).then(([g])=>{MESHY=g;return g;});
}

/* กำมือ: โมเดลจาก Meshy ไม่มีกระดูกนิ้ว มือจึงแบแข็ง -> ดัดนิ้วของเมชให้งอรอบด้ามดาบ (ทำครั้งเดียวต่อโมเดล)
   ในพื้นที่ของกระดูกมือ: แกน Y = ทิศนิ้ว, n = ด้านฝ่ามือ (ทิศคมดาบ), a = แนวด้ามดาบ */
function makeFist(root,hands){
  let sm=null; root.traverse(o=>{if(!sm&&o.isSkinnedMesh)sm=o;}); if(!sm)return;
  const g=sm.geometry, bones=sm.skeleton.bones, U=g.userData.fist||(g.userData.fist={});

    if(!hand||!sw||sw.parent!==hand)return;
    if(!U[sd]){
      const hi=bones.indexOf(hand); if(hi<0){U[sd]={shift:[0,0,0]};return;}
      const M=new THREE.Matrix4().multiplyMatrices(sm.skeleton.boneInverses[hi],sm.bindMatrix), Mi=M.clone().invert();
      const N3=new THREE.Matrix3().getNormalMatrix(M), N3i=new THREE.Matrix3().getNormalMatrix(Mi);
      const Y=new THREE.Vector3(0,1,0), a=new THREE.Vector3(0,1,0).applyQuaternion(sw.quaternion); a.addScaledVector(Y,-a.dot(Y)).normalize();
      const e=new THREE.Vector3(0,0,1).applyQuaternion(sw.quaternion); e.addScaledVector(Y,-e.dot(Y)).addScaledVector(a,-e.dot(a)).normalize();
      const n=e, ax=new THREE.Vector3().crossVectors(Y,n).normalize();
      const P=g.attributes.position, NA=g.attributes.normal, SI=g.attributes.skinIndex, SW=g.attributes.skinWeight;
      const kids=new Set(); hand.traverse(o=>{if(o.isBone&&o!==hand){const k=bones.indexOf(o);if(k>=0)kids.add(k);}});
      const idx=[], L=[], v=new THREE.Vector3(), nv=new THREE.Vector3(), q=new THREE.Quaternion();
      for(let i=0;i<P.count;i++){const si=[SI.getX(i),SI.getY(i),SI.getZ(i),SI.getW(i)],wi=[SW.getX(i),SW.getY(i),SW.getZ(i),SW.getW(i)];
        let w=0;for(let j=0;j<4;j++)if(si[j]===hi||kids.has(si[j]))w+=wi[j]; if(w>.05){idx.push([i,w]);}}
      const u0=sw.position.y, uk=u0+.02;
      // ความกว้างฝ่ามือด้านข้าง (ใช้ตัดนิ้วโป้งที่กางออก)
      idx.forEach(([i])=>{v.fromBufferAttribute(P,i).applyMatrix4(M);if(v.y>0&&v.y<uk)L.push(Math.abs(v.dot(a)-sw.position.dot(a)));});
      L.sort((x,y)=>x-y); const Wl=L.length?L[Math.floor(L.length*.85)]:.04;
      const rh=.021*sw.scale.x, Rb=rh+.016, c0=sw.position.dot(n);

        v.fromBufferAttribute(P,i).applyMatrix4(M);

        const ex=Math.abs(ll)-Wl; if(ex>0&&uu>-.01){ll=Math.sign(ll)*(Wl+ex*.35);vv+=ex*.55;uu-=ex*.15;}
        if(uu>uk){const s2=uu-uk, rho=Rb-vv; th=Math.min(3.5,s2/Rb); uu=uk+rho*Math.sin(th); vv=Rb-rho*Math.cos(th);}
        const out=new THREE.Vector3().addScaledVector(Y,uu).addScaledVector(n,vv+c0).addScaledVector(a,ll+sw.position.dot(a));
        v.lerp(out,Math.min(1,w*1.15)).applyMatrix4(Mi); P.setXYZ(i,v.x,v.y,v.z);
        if(NA&&th>0){nv.fromBufferAttribute(NA,i).applyMatrix3(N3).normalize().applyQuaternion(q.setFromAxisAngle(ax,th*Math.min(1,w))).applyMatrix3(N3i).normalize();NA.setXYZ(i,nv.x,nv.y,nv.z);}
      });

      const sh=new THREE.Vector3().addScaledVector(Y,uk-u0).addScaledVector(n,Rb);
      U[sd]={shift:sh.toArray()};
    }
    sw.position.add(new THREE.Vector3(...U[sd].shift));
  });
}

const FIRE_COL=[0xffd88a,0xffb030,0xff7a1a,0xd8380e,0x4a2014];
const FLAMETEX=canvasTex(64,(x,s)=>{const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.85)');g.addColorStop(.7,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,s,s);});
function fireSprite(pos,vel,life,size,opts){
  opts=opts||{}; if(typeof FXK!=='undefined'&&Math.random()>FXK*1.2)return Promise.resolve();
  const add=!opts.smoke&&Math.random()<.35;
  const m=new THREE.SpriteMaterial({map:FLAMETEX,color:0xffffff,transparent:true,opacity:1,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false,fog:false});
  const s=new THREE.Sprite(m); s.position.copy(pos); s.scale.setScalar(size*.4); scene.add(s);
  const c=new THREE.Color(), p0=pos.clone(), g=opts.grav==null?.6:opts.grav, grow=opts.grow||2.6, rot=(Math.random()-.5)*2;
  return tween(life,k=>{
    s.position.copy(p0).addScaledVector(vel,k*life); s.position.y+=g*k*k*life;
    const sc=size*(.4+k*grow); s.scale.set(sc,sc,1); m.rotation+=rot*.02;
    if(opts.smoke){c.setHex(0x3a2e28);m.opacity=(1-k)*.35;}
    else{const f=Math.min(FIRE_COL.length-1.001,k*(FIRE_COL.length-1));const i=Math.floor(f);c.setHex(FIRE_COL[i]).lerp(new THREE.Color(FIRE_COL[i+1]),f-i);m.opacity=Math.min(.95,(1-k)*1.8)*(add?.8:1);}
    m.color.copy(c);
  },t=>t).then(()=>{scene.remove(s);m.dispose();});
}

const AGENTS=[];
function blockedSeg(ax,az,bx,bz,pad){for(const b of BLOCK){const vx=bx-ax,vz=bz-az,wx=b.x-ax,wz=b.z-az,L=vx*vx+vz*vz||1;const t=Math.max(0,Math.min(1,(wx*vx+wz*vz)/L));const dx=ax+vx*t-b.x,dz=az+vz*t-b.z;if(Math.hypot(dx,dz)<b.r+pad)return true;}return false;}
function freePoint(pad){for(let k=0;k<200;k++){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*14.2,x=Math.cos(a)*r,z=Math.sin(a)*r;if(onIsland(x,z,1.5)&&!BLOCK.some(b=>Math.hypot(x-b.x,z-b.z)<b.r+pad))return[x,z];}return[0,7];}
function addAgent(data,at,pop){
  const spc=SPEC[data.sp]||SPEC.kazemaru;
  if(spc.dragon&&DRAGON){const w=buildDragon();w.scale.setScalar(1.7);scene.add(w);
    w.traverse(o=>{if(o.isMesh){o.userData.agent=AGENTS.length;PICK.push(o);}});
    const ag={w,inner:w.userData.inner,data,evo:1,fly:true,ang:Math.random()*6.28,r:8.5+Math.random()*1.5,state:'fly'};AGENTS.push(ag);
    if(pop){w.scale.setScalar(.001);tween(.8,t=>w.scale.setScalar(Math.max(.001,1.7*t)),easeBack);}return ag;}
  const w=buildMonster(spc.rig||(spc.evo?1:0)); w.userData.k*=1.5; w.scale.setScalar(w.userData.k); scene.add(w);
  const [x,z]=at||freePoint(.8); w.position.set(x,0,z); w.rotation.y=Math.random()*6;
  const inner=w.userData.inner;
  w.traverse(o=>{if(o.isMesh){o.userData.agent=AGENTS.length;PICK.push(o);}});
  const ag={w,inner,data,evo:spc.evo,state:'idle',wait:1+Math.random()*3,tx:x,tz:z,ph:Math.random()*6,yaw:w.rotation.y,speed:spc.evo?1.45:1.0};
  AGENTS.push(ag);
  if(pop){const k=w.userData.k;w.scale.setScalar(.001);tween(.6,t=>w.scale.setScalar(Math.max(.001,k*t)),easeBack);}
  return ag;
}
function agentUpdate(ag,dt){
  const w=ag.w, rig=ag.inner.userData.rig, A=ag.inner.userData;
  if(ag.fly){ag.ang+=dt*.22;const x=Math.cos(ag.ang)*ag.r,z=Math.sin(ag.ang)*ag.r*.8;w.position.set(x,4.2+Math.sin(ag.ang*3)*.6,z);w.rotation.y=Math.atan2(-Math.sin(ag.ang)*ag.r,Math.cos(ag.ang)*ag.r*.8);w.rotation.z=-.18;return;}
  const MC=!!(A.play&&A.clipInfo&&A.clipInfo('walk'));
  if(MC){if(ag.state==='walk'&&!ag.walking){ag.walking=1;A.play('walk',{loop:true,fade:.25});}else if(ag.state!=='walk'&&ag.walking){ag.walking=0;A.play('idle',{loop:true,fade:.3});}}
  else if(A.clipW)A.clipW(ag.state==='walk'?0:1);
  if(ag.state==='idle'){ag.wait-=dt;if(ag.wait<=0){
    for(let k=0;k<14;k++){const [tx,tz]=freePoint(.6);if(Math.hypot(tx-w.position.x,tz-w.position.z)>2&&!blockedSeg(w.position.x,w.position.z,tx,tz,.35)){ag.tx=tx;ag.tz=tz;ag.state='walk';break;}}
    if(ag.state!=='walk')ag.wait=1;}
    return;}
  const dx=ag.tx-w.position.x,dz=ag.tz-w.position.z,d=Math.hypot(dx,dz);
  if(d<.15){ag.state='idle';ag.wait=2+Math.random()*5;ag.inner.rotation.z=0;poseTo(rig.base,.45);return;}
  const want=Math.atan2(dx,dz);let diff=want-ag.yaw;diff=Math.atan2(Math.sin(diff),Math.cos(diff));ag.yaw+=diff*Math.min(1,dt*6);w.rotation.y=ag.yaw;
  const sp=ag.speed*(MC?.8:1)*(Math.abs(diff)>1?.3:1);
  w.position.x+=Math.sin(ag.yaw)*sp*dt; w.position.z+=Math.cos(ag.yaw)*sp*dt;
  ag.ph+=dt*(ag.evo?6.5:9);
  const s=Math.sin(ag.ph), c=Math.cos(ag.ph);
  if(MC){}
  else if(ag.evo){
    const [l0,l1]=rig.legs;
    channel(l0.th.rotation,'x').t=-.06-s*.5; channel(l1.th.rotation,'x').t=.06+s*.5;
    channel(l0.kn.rotation,'x').t=.1+Math.max(0,c)*.75; channel(l1.kn.rotation,'x').t=.06+Math.max(0,-c)*.75;
    channel(rig.R.sh.rotation,'x').t=.06+s*.38; channel(rig.L.sh.rotation,'x').t=.02-s*.38;
    channel(rig.hips.position,'y').t=.88-Math.abs(c)*.035; channel(rig.torso.rotation,'y').t=-.04-s*.1;
    [l0.th,l0.kn,l1.th,l1.kn,rig.R.sh,rig.L.sh].forEach(j=>{channel(j.rotation,'x').k=260;channel(j.rotation,'x').z=.85;});
  } else {
    ag.inner.rotation.z=s*.13;
    channel(rig.L.a.rotation,'x').t=-.6+s*.5;
  }
}

let hatching=false;
async function hatch(kind,name){
  if(hatching)return; hatching=true; closeSheet(); camTTo.set(0,0,5); distTo=16;
  const shake=tween(1.4,t=>{hatchEggMat.emissiveIntensity=.25+t*2.5;hatchEgg.rotation.y+=.2+t*.6;hatchEgg.position.y=2.15+Math.sin(t*40)*.03*t;});
  const r=await act('hatch_egg',{kind}); await shake; hatchEggMat.emissiveIntensity=.25;
  if(!r){hatching=false;return;}
  bumpRes(kind==='gold'?'amber':'coins');
  const col=tierOf(r.rar).hx;
  const ep=new THREE.Vector3(0,2.15,3.2);
  flashBall(ep,col,r.rar>=4?6:r.rar>=3?5:4); particles(ep,col,r.rar>=4?120:r.rar>=3?85:60,3.2,.07,1.6); particles(ep,0xffffff,24,2.4,.05,1.2);
  if(r.rar>=4){shakeCam=.4;}else if(r.rar>=3){shakeCam=.2;}
  const d=S.mons.find(m=>m.uid===Number(r.mon.id))||{uid:Number(r.mon.id),sp:r.mon.sp,lv:1};
  const ag=addAgent(d,[0,5.9],true); if(!ag.fly){ag.state='idle'; ag.wait=2.5;}
  toast(name+' ฟักแล้ว! ได้'+SPEC[r.mon.sp].name+' ระดับ'+tierOf(r.rar).n+(r.rar>=4?'!!':r.rar>=3?'!':' เดินออกมาในฟาร์มแล้ว'));
  hatching=false;
}

const camT=new THREE.Vector3(0,0,.5), camTTo=camT.clone(); let dist=44, distTo=40;
const PITCH=.92;
const ptrs=new Map(); let downAt=null, moved=0, pinch0=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});downAt={x:e.clientX,y:e.clientY};moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);const k=dist*.0017;camTTo.x-=dx*k;camTTo.z-=dy*k/Math.cos(PITCH)*.7;const r=Math.hypot(camTTo.x,camTTo.z);if(r>14)camTTo.multiplyScalar(14/r);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){distTo=Math.max(12,Math.min(58,distTo*pinch0/d));}pinch0=d;moved=99;}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(ptrs.size===0&&downAt&&moved<8)tap(e.clientX,e.clientY);if(ptrs.size===0)downAt=null;};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);downAt=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();distTo=Math.max(12,Math.min(58,distTo*(1+e.deltaY*.0012)));},{passive:false});
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();

    $('#mtName').textContent=spOf(ag.data).name; $('#mtInfo').textContent=tierOf(spOf(ag.data).rar).n+' · Lv '+ag.data.lv+' · '+(ag.state==='walk'?'กำลังเดินเล่น':'กำลังพักผ่อน');

const clock=new THREE.Clock(); let T=0, regen=0;
const wfOff=waterfallT.offset, pOff=pondT.offset, v3=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);

  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.d);tw.fn(tw.ease(k));if(k>=1){tweens.splice(i,1);tw.r();}}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.p.position.addScaledVector(q.v,dt);q.v.y-=dt*q.grav;q.v.multiplyScalar(q.grow?.96:1);q.life-=dt*q.decay;q.p.material.opacity=Math.max(0,q.life*q.o);if(q.grow)q.p.scale.multiplyScalar(1+dt*.9);if(q.life<=0){scene.remove(q.p);q.p.material.dispose();parts.splice(i,1);}}
  AGENTS.forEach(a=>agentUpdate(a,dt));
  rigUpdate(dt);
  AGENTS.forEach(a=>a.inner.userData.idle(T));
  // น้ำ เมฆ สิ่งมีชีวิตเล็ก ๆ
  wfOff.y+=dt*1.2; pOff.x+=dt*.02; pOff.y+=dt*.015;
  if(Math.random()<dt*14)particles(v3.set(1.5+(Math.random()-.5)*1.2,.2,-8.9),0xffffff,1,.8,.08,1.2,.7);
  worldTick(dt,T);

  fallLeaves.forEach((l,i)=>{l.position.y-=dt*.35;l.position.x+=Math.sin(T+i)*dt*.3;l.rotation.x+=dt*(1.5+i%3);l.rotation.y+=dt;if(l.position.y<.05)l.position.set(4+Math.random()*4,4+Math.random()*2.5,-8+Math.random()*5);});
  scene.traverse&&0;

  if(S.energy<S.energyMax){S.energyNext-=dt;if(S.energyNext<=0){S.energy++;S.energyNext+=S.energySec;renderHUD();}}
  regen+=dt; if(regen>=.5){regen=0;$('#rTimer').textContent=S.energy<S.energyMax?('+1 ใน '+fmtClock(S.energyNext)):'';}
  if(tagAgent){const w=tagAgent.w;v3.set(w.position.x,(tagAgent.fly?tagAgent.w.position.y+2.4:tagAgent.evo?4.1:2.6),w.position.z).project(camera);const t=$('#mtag');t.style.left=((v3.x*.5+.5)*view.clientWidth)+'px';t.style.top=((-v3.y*.5+.5)*view.clientHeight)+'px';}
  camT.lerp(camTTo,Math.min(1,dt*6)); dist+=(distTo-dist)*Math.min(1,dt*6);

  bCam.position.set(dr?2.4:1.2, h+(dr?1.6:.8), d*(port?1.3:1)); bCam.lookAt(0,h,0);
}
// ไอคอนหน้ามอนสเตอร์: ถ่ายเฉพาะส่วนหัวจากโมเดลจริง บนพื้นสีตามธาตุ
const THUMB={};
function headOf(w,sp){
  const inner=w.userData.inner, R=inner.userData.rig; let hb=null;
  if(SPEC[sp].dragon&&R&&R.head)hb=R.head;
  else inner.traverse(o=>{if(!hb&&o.isBone&&/Head$/.test(o.name))hb=o;});
  const box=new THREE.Box3(); inner.traverse(o=>{if(o.isMesh&&!o.userData.outline&&!o.userData.noBox)box.expandByObject(o);});
  const H=box.max.y-box.min.y;
  const F=FACE[sp]||{dx:0,dy:0,r:.3}; let p;
  if(hb){p=new THREE.Vector3();hb.getWorldPosition(p);}
  else p=new THREE.Vector3((box.min.x+box.max.x)/2,box.max.y-.3*H,(box.min.z+box.max.z)/2);
  return{p:p.add(new THREE.Vector3(F.dx*H,F.dy*H,0)),r:F.r*H};
}
// ปรับกรอบหน้าแต่ละสายพันธุ์ (สัดส่วนของความสูงตัว)
const FACE={hakuneko:{dx:0,dy:.02,r:.15},morihime:{dx:0,dy:.02,r:.15},kuroga:{dx:-.03,dy:.03,r:.14},kazekiri:{dx:-.05,dy:.02,r:.14},amateru:{dx:-.07,dy:-.13,r:.21},kazemaru:{dx:.04,dy:.08,r:.36}};
function makeThumb(sp){
  if(THUMB[sp])return THUMB[sp];
  const W=192, rt=new THREE.WebGLRenderTarget(W,W,{encoding:THREE.sRGBEncoding}); rt.texture.encoding=THREE.sRGBEncoding;
  const prevSp=BOX.model&&BOX.model.userData.sp;
  const w=boxModel(sp); const A=w.userData.inner.userData;
  if(A.clipW)A.clipW(0); for(let i=0;i<3;i++){A.idle&&A.idle(1+i*.016);} rigUpdate(.016);
  w.rotation.y=SPEC[sp].dragon?-.35:-.3; bScene.updateMatrixWorld(true);
  const f=headOf(w,sp), cam=new THREE.PerspectiveCamera(30,1,.05,100);
  const dist=f.r/Math.tan(15*Math.PI/180);
  cam.position.copy(f.p).add(new THREE.Vector3(.12*dist,.1*dist,dist)); cam.lookAt(f.p.x,f.p.y-.05*f.r,f.p.z);
  BOX.deco.forEach(o=>o.visible=false); const fog=bScene.fog, fn=fog.near, ff=fog.far; fog.near=900; fog.far=1000;
  const cc=renderer.getClearColor(new THREE.Color()), ca=renderer.getClearAlpha(); renderer.setClearColor(0,0);
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(bScene,cam); renderer.setRenderTarget(null);
  renderer.setClearColor(cc,ca); fog.near=fn; fog.far=ff; BOX.deco.forEach(o=>o.visible=true);
  const px=new Uint8Array(W*W*4); renderer.readRenderTargetPixels(rt,0,0,W,W,px);
  const c=document.createElement('canvas'); c.width=c.height=W; const x=c.getContext('2d'), im=x.createImageData(W,W);
  for(let y=0;y<W;y++)im.data.set(px.subarray((W-1-y)*W*4,(W-y)*W*4),y*W*4);
  const fg=document.createElement('canvas'); fg.width=fg.height=W; fg.getContext('2d').putImageData(im,0,0);
  const col=SPEC[sp].elc, g=x.createRadialGradient(W*.5,W*.42,W*.05,W*.5,W*.5,W*.75);
  g.addColorStop(0,col); g.addColorStop(.55,'#3a2a1e'); g.addColorStop(1,'#140e0a');
  x.fillStyle=g; x.fillRect(0,0,W,W);
  x.globalAlpha=.18; x.strokeStyle='#fff'; x.lineWidth=2; for(let i=-W;i<W;i+=14){x.beginPath();x.moveTo(i,W);x.lineTo(i+W,0);x.stroke();} x.globalAlpha=1;
  x.drawImage(fg,0,0);
  THUMB[sp]=c.toDataURL('image/jpeg',.88); rt.dispose();
  if(prevSp)boxModel(prevSp); else{bScene.remove(BOX.model);BOX.model=null;}
  return THUMB[sp];
}

function boxSpark(p,color,n,speed){for(let i=0;i<n;i++){const g=glow(bScene,color,.18,[p.x,p.y,p.z],1);const v=new THREE.Vector3((Math.random()-.5),Math.random()*.9+.2,(Math.random()-.5)).normalize().multiplyScalar(speed*(.4+Math.random()*.8));const p0=g.position.clone();
  tween(.9+Math.random()*.5,k=>{g.position.copy(p0).addScaledVector(v,k*1.2);g.position.y-=k*k*.6;g.material.opacity=1-k;}).then(()=>{bScene.remove(g);g.material.dispose();});}}
/* ---------- หน้าต่างมอนสเตอร์ ---------- */
const CAP=30, stars=n=>tierOf(n).n;
const FLAG='<svg viewBox="0 0 12 12"><path d="M3 1v10M3 1.5h6l-1.6 2.2L9 6H3" fill="#2b1808" stroke="#2b1808" stroke-width="1.3" stroke-linejoin="round"/></svg>';
const PAW='<svg viewBox="0 0 24 24" fill="#ffd9a0"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></svg>';
let boxSort='power', boxTab='info';
function openBox(){BOX.win=true;BOX.open=false;$('#box').hidden=false;$('#box').classList.remove('v3d');$('#mdet').hidden=true;closeSheet();
  document.body.classList.add('boxOpen');
  if(!S.mons.some(m=>m.uid===BOX.detail))BOX.detail=(S.mons.find(m=>m.uid===S.team[0])||S.mons[0]||{}).uid;
  renderBox();}
function closeBox(){BOX.win=false;BOX.open=false;$('#box').hidden=true;document.body.classList.remove('boxOpen');if(BOX.model){bScene.remove(BOX.model);BOX.model=null;}syncAgents();}
function icon(m,cls){const sp=spOf(m);const c=el('button','ic r'+sp.rar+(cls?' '+cls:''));
  const img=el('img');img.src=makeThumb(m.sp);img.alt=sp.name;c.append(img);
  c.append(el('span','st',stars(sp.rar)));
  const lv=el('span','lv'+(m.lv>=sp.maxLv?' max':''),m.lv+'');c.append(lv);
  if(S.team.includes(m.uid)){const t=el('span','tm');t.innerHTML=FLAG;c.append(t);}
  if(sp.evolveTo&&m.lv>=sp.maxLv){const e=el('span','ev','↑');e.title='วิวัฒนาการได้';c.append(e);}
  c.title=sp.name+' Lv'+m.lv; return c;}
function renderTeam(){
  const t=$('#bTeam'); t.innerHTML='';
  for(let i=0;i<6;i++){const m=S.mons.find(x=>x.uid===S.team[i]);let s;
    if(m){s=icon(m);s.querySelector('.tm')&&s.querySelector('.tm').remove();s.onclick=()=>selectMon(m.uid);}
    else{s=el('button','ic empty');s.innerHTML=PAW;s.onclick=()=>toast('เลือกมอนสเตอร์ แล้วกด "ใส่ทีม"');}
    if(i===0&&m)s.append(el('em',null,'ผู้นำ'));
    t.append(s);}
  const tp=S.team.map(u=>S.mons.find(m=>m.uid===u)).filter(Boolean).reduce((a,m)=>a+power(m),0);
  $('#bTeamPow').textContent='พลังทีม '+fmt(tp);
}
function sorted(){return[...S.mons].sort((a,b)=>boxSort==='lv'?b.lv-a.lv:boxSort==='rar'?(spOf(b).rar-spOf(a).rar||b.lv-a.lv):boxSort==='new'?b.uid-a.uid:power(b)-power(a));}
function renderBox(){
  $('#bCount').textContent=S.mons.length+'/'+CAP;
  renderTeam();
  const g=$('#bList'); g.innerHTML='';
  sorted().forEach(m=>{const c=icon(m,m.uid===BOX.detail?'sel':'');c.dataset.uid=m.uid;c.onclick=()=>selectMon(m.uid);g.append(c);});
  for(let i=S.mons.length;i<CAP;i++){const e=el('div','ic empty');e.innerHTML=PAW;g.append(e);}
  $('#bSort').value=boxSort;
  renderDetail();
}
function selectMon(uid){BOX.detail=uid;renderBox();}
function renderDetail(){
  const m=S.mons.find(x=>x.uid===BOX.detail), P=$('#bPage'); P.innerHTML='';
  document.querySelectorAll('.bTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===boxTab));
  if(!m)return; const sp=spOf(m), st=statOf(m);
  const h=el('div','iHead');const e=el('span','iEl',sp.el);e.style.background=sp.elc;h.append(e);h.append(el('b',null,sp.name));{const tg=el('span','iTier r'+sp.rar,stars(sp.rar));h.append(tg);}P.append(h);
  P.append(el('div','iSub',sp.title+' · '+sp.role));
  if(boxTab==='info'){
    const x=el('div','iExp');x.append(el('span',null,'LV'));const bar=el('div');const i=el('i');i.style.width=(m.lv/sp.maxLv*100)+'%';bar.append(i);bar.append(el('em',null,m.lv>=sp.maxLv?'MAX':m.lv+' / '+sp.maxLv));x.append(bar);P.append(x);
    const T=el('table','iTbl');
    [['เลเวล',m.lv+' / '+sp.maxLv],['พลังชีวิต (HP)',fmt(st.hp*10)],['โจมตี (ATK)',st.atk*10],['ป้องกัน (DEF)',st.def*10],['ความเร็ว (SPD)',st.spd],['ธาตุ','ธาตุ'+sp.el],['พลังรวม',fmt(power(m)),'pw']]
      .forEach(([k,v,c],j)=>{const r=el('tr',j===5?'sep':'');r.append(el('td',null,k));const td=el('td',c||null,v+'');if(j===5)td.style.color=sp.elc;r.append(td);T.append(r);});
    P.append(T);
  }else if(boxTab==='skill'){sp.skills.forEach(([n,d],i)=>{const s=el('div','skr');s.append(el('span','skn',(i+1)+''));const t=el('div');t.append(el('b',null,n));t.append(el('p',null,d));s.append(t);P.append(s);});}
  else P.append(el('p','iLore',sp.lore));
  const inT=S.team.includes(m.uid);
  $('#mdTeam').innerHTML='';$('#mdTeam').append(el('span',null,inT?'ออกทีม':'ใส่ทีม'));$('#mdTeam').append(el('small',null,inT?'อยู่ในทีม':S.team.length>=6?'สลับตัวที่ 6':'ทีม '+S.team.length+'/6'));
  const maxed=m.lv>=sp.maxLv, cost=lvCost(m);
  $('#mdUp').innerHTML=''; $('#mdUp').append(el('span',null,maxed?'MAX':'อัปเลเวล')); $('#mdUp').append(el('small',null,maxed?'เลเวลเต็ม':fmt(cost)+' เหรียญ'));
  $('#mdUp').disabled=maxed;
  const canEvo=sp.evolveTo&&maxed; $('#mdEvo').disabled=!canEvo;
  $('#mdEvo').innerHTML=''; $('#mdEvo').append(el('span',null,'วิวัฒน์')); $('#mdEvo').append(el('small',null,!sp.evolveTo?'ร่างสุดท้าย':canEvo?'300 เหรียญ':'ต้อง Lv '+sp.maxLv));
}
document.querySelectorAll('.bTabs button').forEach(b=>b.onclick=()=>{boxTab=b.dataset.t;renderDetail();});
$('#bSort').onchange=e=>{boxSort=e.target.value;renderBox();};
$('#bClose').onclick=closeBox;
$('#box').addEventListener('pointerdown',e=>{if(e.target.id==='box')closeBox();});
function open3d(){const m=S.mons.find(x=>x.uid===BOX.detail);if(!m)return;
  BOX.open=true;$('#box').classList.add('v3d');$('#mdet').hidden=false;$('#md3Name').textContent=spOf(m).name+' Lv'+m.lv;
  boxModel(m.sp);boxLayout();const A=BOX.model.userData.inner.userData;if(A.play)A.play('victory',{fade:.25});
  if(spOf(m).dragon)dragonSet({rig:A.rig},{rear:1,spread:1,breath:1},.4),setTimeout(()=>BOX.model&&dragonSet({rig:BOX.model.userData.inner.userData.rig},{rear:0,spread:0,breath:0},.6),1300);}
function close3d(){BOX.open=false;$('#box').classList.remove('v3d');$('#mdet').hidden=true;if(BOX.model){bScene.remove(BOX.model);BOX.model=null;}renderBox();}
$('#md3d').onclick=open3d; $('#mdBack').onclick=close3d;
$('#mdTeam').onclick=async()=>{const m=S.mons.find(x=>x.uid===BOX.detail);if(!m)return;const t=[...S.team];const i=t.indexOf(m.uid);let msg;
  if(i>=0){if(t.length<=1)return toast('ทีมต้องมีอย่างน้อย 1 ตัว');t.splice(i,1);msg=spOf(m).name+' ออกจากทีมแล้ว';}
  else if(t.length>=6){const out=S.mons.find(x=>x.uid===t[5]);t[5]=m.uid;msg='สลับ '+spOf(out).name+' ออก ใส่ '+spOf(m).name+' แทน';}
  else{t.push(m.uid);msg=spOf(m).name+' เข้าทีมแล้ว';}
  if(await act('set_team',{ids:t})){toast(msg);renderBox();}};
$('#mdUp').onclick=async()=>{const uid=BOX.detail;const m=S.mons.find(x=>x.uid===uid);if(!m)return;const sp=spOf(m);if(m.lv>=sp.maxLv)return;
  const r=await act('level_up',{mon_id:uid});if(!r)return;
  bumpRes('coins');renderBox();const ic=$('#bList .ic.sel');if(ic)ic.classList.add('pop');
  if(r.lv>=sp.maxLv&&sp.evolveTo)toast('ถึงเลเวลสูงสุด! วิวัฒนาการได้แล้ว');};
$('#mdEvo').onclick=async()=>{const uid=BOX.detail;const m=S.mons.find(x=>x.uid===uid);if(!m)return;const sp=spOf(m);if(!sp.evolveTo||m.lv<sp.maxLv)return;
  open3d(); $('#mdBack').disabled=true;
  const w=BOX.model; const p=new THREE.Vector3(0,1,0);
  const glowT=tween(1.4,t=>{w.rotation.y+=.05+t*.5;w.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive){o.material.emissive.setHex(0xfff0c0);o.material.emissiveIntensity=t*2;}});});
  const r=await act('evolve_monster',{mon_id:uid}); await glowT;
  if(!r){boxModel(m.sp);$('#mdBack').disabled=false;return;}
  bumpRes('coins');
  boxSpark(p,0xffffff,70,3.4);boxSpark(p,0xffc94d,50,2.6);
  boxModel(r.sp); $('#md3Name').textContent=SPEC[r.sp].name+' Lv1';
  boxSpark(p,0xffc94d,40,2); const A=BOX.model.userData.inner.userData; if(A.play)A.play('victory',{fade:.1});
  $('#mdBack').disabled=false; toast('วิวัฒนาการสำเร็จ! กลายเป็น '+SPEC[r.sp].name);};
// หมุนโมเดลด้วยการลาก (มุมมอง 3D)
addEventListener('pointerdown',e=>{if(!BOX.open||e.target.closest('button'))return;BOX.drag={x:e.clientX,s:BOX.spin};});
addEventListener('pointermove',e=>{if(BOX.drag)BOX.spin=BOX.drag.s+(e.clientX-BOX.drag.x)*.012;});
addEventListener('pointerup',()=>BOX.drag=null);
function boxLayout(){const w=view.clientWidth,h=view.clientHeight;bCam.aspect=w/h;bCam.fov=bCam.aspect<.9?42:30;bCam.updateProjectionMatrix();}
function boxFrame(dt,T){
  BOX.t+=dt;
  if(BOX.model){const A=BOX.model.userData.inner.userData;A.idle&&A.idle(T);if(!BOX.drag)BOX.spin+=dt*.25;BOX.model.rotation.y=-.45+BOX.spin;}
  BOX.motes.forEach(f=>{const [a,b,p]=f.userData.p;f.position.set(p.x+Math.sin(T*.4+a)*.4,p.y+Math.sin(T*.6+b)*.3,p.z);f.material.opacity=.3+.5*Math.sin(T*1.5+a*3);});
  BOX.ring.material.opacity=.6+.3*Math.sin(T*2);
  frameCam();
  renderer.render(bScene,bCam);
}
$('#nMons').onclick=openBox;

startFarm();

})();
